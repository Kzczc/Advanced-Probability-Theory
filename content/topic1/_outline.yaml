  - { page: 31, slide: "30/42", kind: theorem, title: 简单函数的积分与写法无关, title_en: "The simple integral is representation independent" }
  - { page: 32, slide: "31/42", kind: theorem, title: 简单函数积分的线性与单调性, title_en: "Linearity and monotonicity for simple functions" }
  - { page: 33, slide: "32/42", kind: definition, title: 从下方逼近：把积分推广到非负可测函数, title_en: "Extend the simple integral by lower approximation" }
