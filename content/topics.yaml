# 全站目录：各讲课件。每讲的逐页大纲（小节划分、每页标题）在 content/<topic>/_outline.yaml。
site:
  title: 高等概率论 · 逐页精讲
  subtitle: 写给数学基础薄弱的同学：课件原页对照、零基础补课、公式推导、老师板书逐条解读、例子与自测
  english: Advanced Probability Theory
topics:
  - id: topic1
    number: 1
    title: 测度与积分
    english: Measure and Integration for Probability
    pdf: Topic1_measure_and_integration_full_noted.pdf
    pages: 47
    summary: 先弄清「哪些集合可以谈概率」（σ-代数），再把「长度」推广成测度，最后建立勒贝格积分，并学会用 MCT、Fatou 引理、DCT 判断极限和积分能不能交换。
  - id: topic2
    number: 2
    title: 随机变量、期望与不等式
    english: Random Variables, Expectation, and Inequalities
    pdf: Topic2_random_variables_expectation_inequalities.pdf
    pages: 32
    summary: 随机变量是可测映射，期望就是对概率测度的积分；再用 CDF、分位数、矩和各种不等式把期望与尾概率算出来、估出来。
  - id: topic3
    number: 3
    title: Borel–Cantelli、收敛与 Radon–Nikodym
    english: Borel–Cantelli, Sequence Convergence, and Radon–Nikodym
    pdf: Topic3_borel_cantelli_convergence_radon_nikodym_class_flow.pdf
    pages: 47
    summary: 事件会不会发生无穷多次、随机变量的几种收敛方式、什么条件下期望可以取极限，以及换测度（重要性抽样）怎么做。
  - id: topic4
    number: 4
    title: 乘积测度与独立性
    english: Product Measure and Independence
    pdf: Topic4_product_measure_and_independence.pdf
    pages: 21
    summary: 两个概率空间怎样拼成一个联合空间（乘积 σ-代数与乘积测度），二重积分什么时候能拆成两次单重积分（Fubini–Tonelli），以及独立性的精确定义：联合分布等于边缘分布的乘积；最后看多元正态分布里「协方差为 0」为什么等价于独立。
  - id: hw1
    group: exercise
    label: 作业 1
    number: 1
    title: Borel–Cantelli 引理、概率不等式与收敛定理
    english: Homework 1 (with solutions)
    pdf: HW1_solution.pdf
    pages: 12
    summary: 12 道题：用 Borel–Cantelli 引理判断事件会不会发生无穷多次，依测度收敛的运算，积分不等式及其等号条件，以及 Fatou 引理、控制收敛定理的典型用法与反例。
  - id: hw2
    group: exercise
    label: 作业 2
    number: 2
    title: 收敛方式、大数定律、中心极限定理与鞅
    english: Homework 2 (with solutions)
    pdf: HW2_solution.pdf
    pages: 12
    summary: 12 道题：Lᵖ 收敛的判别与乘积的收敛，由中心极限定理推出大数定律，Glivenko–Cantelli 定理，高维球面上的正态近似，相依序列的大数定律，随机项数的中心极限定理，以及分支过程、赌徒破产中的鞅与可选停止定理。
  - id: quiz1
    group: exercise
    label: 小测 1
    number: 1
    title: 收敛定理与两种收敛方式
    english: Quiz 1 (with solutions)
    pdf: Quiz1_solution.pdf
    pages: 4
    summary: 4 道题：叙述 Fatou 引理与控制收敛定理，并用前者证明后者；几乎处处收敛时，「L¹ 收敛」等价于「绝对值的积分收敛」；Lᵖ 收敛下积分上界的保持。
  - id: quiz2
    group: exercise
    label: 小测 2
    number: 2
    title: 收敛方式与一致可积
    english: Quiz 2 (with solutions)
    pdf: Quiz2_solution.pdf
    pages: 4
    summary: 4 道题：Lᵖ 收敛推不出几乎必然收敛；一致可积的定义与等价刻画；独立随机变量序列的极限只能是常数。
