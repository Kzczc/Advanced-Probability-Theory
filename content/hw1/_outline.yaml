# 作业 1 逐题大纲。source 标明每道题在解答 PDF 中的位置：page 是 PDF 页码，from/to 是占页高的比例。
sections:
  - id: s1
    title: Borel–Cantelli 引理的应用
    title_en: Applications of the Borel–Cantelli lemmas
    pages: [1, 5]
  - id: s2
    title: 依测度收敛与积分不等式
    title_en: Convergence in measure and an integral inequality
    pages: [6, 7]
  - id: s3
    title: 积分的收敛定理与不等式
    title_en: Convergence theorems and inequalities for integrals
    pages: [8, 12]

pages:
  - { page: 1, slide: "第 1 页", kind: proof-exercise, title: 任何随机变量序列都能被某个 cₙ → ∞ 压到 0, title_en: "Some cₙ → ∞ makes Xₙ/cₙ → 0 a.s.", source: [{ page: 1, from: 0.085, to: 0.442 }] }
