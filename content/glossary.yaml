# 术语表：讲义正文里第一次出现这些词时，会自动加上悬浮解释；每页末尾会列出本页用到的术语。
# 字段：id（英文标识）、term（中文）、aliases（其他中文写法）、en（英文）、plain（一句白话）、topic/page（首次出现位置）

# ---------- 集合与逻辑 ----------
- id: "set"
  term: "集合"
  en: "set"
  plain: "把一些对象放在一起当成一个整体，例如 {1,2,3}。"
  topic: 1
  page: 5
- id: "element"
  term: "元素"
  en: "element"
  plain: "集合里的对象。ω ∈ Ω 读作「ω 属于 Ω」。"
  topic: 1
  page: 5
- id: "subset"
  term: "子集"
  en: "subset"
  plain: "A 的每个元素都在 B 里，就说 A 是 B 的子集，记作 A ⊆ B。"
  topic: 1
  page: 6
- id: "empty-set"
  term: "空集"
  en: "empty set"
  plain: "一个元素也没有的集合，记作 ∅。作为事件，它永远不会发生。"
  topic: 1
  page: 6
- id: "union"
  term: "并集"
  en: "union"
  plain: "至少属于其中一个集合的元素全体，A ∪ B 对应「A 或 B」。"
  topic: 1
  page: 6
- id: "intersection"
  term: "交集"
  not_after: "相"
  en: "intersection"
  plain: "同时属于两个集合的元素全体，A ∩ B 对应「A 且 B」。"
  topic: 1
  page: 6
- id: "complement"
  term: "补集"
  en: "complement"
  plain: "样本空间里不属于 A 的元素全体，记作 Aᶜ，对应「A 不发生」。"
  topic: 1
  page: 6
- id: "set-difference"
  term: "差集"
  en: "set difference"
  plain: "在 A 里但不在 B 里的元素，记作 A \\ B，等于 A ∩ Bᶜ。"
  topic: 1
  page: 6
- id: "power-set"
  term: "幂集"
  en: "power set"
  plain: "一个集合的所有子集组成的集合族，记作 2^Ω；n 个元素的集合有 2ⁿ 个子集。"
  topic: 1
  page: 6
- id: "family-of-sets"
  term: "集合族"
  en: "family of sets"
  plain: "元素本身都是集合的集合，例如事件族 𝓕。"
  topic: 1
  page: 6
- id: "de-morgan"
  term: "德摩根律"
  en: "De Morgan's laws"
  plain: "「并的补 = 补的交」「交的补 = 补的并」，把「非（A 或 B）」变成「非 A 且非 B」。"
  topic: 1
  page: 6
- id: "pairwise-disjoint"
  term: "两两不交"
  aliases: ["两两不相交", "互不相交"]
  en: "pairwise disjoint"
  plain: "一列集合中任意两个都没有公共元素，对应「任意两件事不会同时发生」。"
  topic: 1
  page: 8
- id: "cartesian-product"
  term: "笛卡尔积"
  en: "Cartesian product"
  plain: "A × B 是所有有序对 (a, b) 组成的集合；Aⁿ 是所有长度为 n 的数组。"
  topic: 1
  page: 5
- id: "countable"
  term: "可数"
  en: "countable"
  plain: "元素能排成第 1 个、第 2 个、第 3 个……的一列（有限也算），例如自然数、有理数。"
  topic: 1
  page: 7
- id: "uncountable"
  term: "不可数"
  en: "uncountable"
  plain: "无论怎么排都排不成一列，例如区间 [0,1] 里的全体实数。"
  topic: 1
  page: 7
- id: "rational"
  term: "有理数"
  en: "rational number"
  plain: "能写成分数 p/q 的数，全体有理数记作 ℚ；它们可数，却在数轴上处处稠密。"
  topic: 1
  page: 17
- id: "dense"
  term: "稠密"
  en: "dense"
  plain: "任何一小段区间里都能找到它的点，例如有理数在实数轴上稠密。"
  topic: 1
  page: 17
- id: "interval"
  term: "区间"
  en: "interval"
  plain: "数轴上的一段，[a,b] 包含端点，(a,b) 不包含端点。"
  topic: 1
  page: 5
- id: "equivalence-relation"
  term: "等价关系"
  en: "equivalence relation"
  plain: "满足自反、对称、传递的「相似」关系，能把集合分成互不重叠的等价类。"
  topic: 1
  page: 21
- id: "equivalence-class"
  term: "等价类"
  en: "equivalence class"
  plain: "在等价关系下彼此「相似」的元素组成的一组。"
  topic: 1
  page: 21
- id: "axiom-of-choice"
  term: "选择公理"
  en: "axiom of choice"
  plain: "允许从无穷多个非空集合里各挑一个元素，组成一个新集合；维塔利集就是这样造的。"
  topic: 1
  page: 21

# ---------- 函数、极限与确界 ----------
- id: "function"
  term: "函数"
  aliases: ["映射"]
  en: "function / map"
  plain: "f: A → B 给 A 中每个元素指定 B 中唯一一个元素。"
  topic: 1
  page: 5
- id: "preimage"
  term: "原像"
  en: "preimage"
  plain: "f⁻¹(B) 是「所有被 f 送进 B 的输入」组成的集合，可测性就是用原像定义的。"
  topic: 1
  page: 29
- id: "indicator"
  term: "示性函数"
  en: "indicator function"
  plain: "𝟏_A(x) 在 x ∈ A 时取 1，否则取 0；它的积分就是 A 的测度。"
  topic: 1
  page: 30
- id: "supremum"
  term: "上确界"
  en: "supremum (sup)"
  plain: "最小的上界。最大值不一定存在，但有上界的实数集一定有上确界。"
  topic: 1
  page: 16
- id: "infimum"
  term: "下确界"
  en: "infimum (inf)"
  plain: "最大的下界。例如 (0,1] 没有最小值，但下确界是 0。"
  topic: 1
  page: 16
- id: "limsup"
  term: "上极限"
  en: "limit superior (lim sup)"
  plain: "数列「尾部的最大可能值」的极限；对集合则表示「发生无穷多次」。"
  topic: 1
  page: 7
- id: "liminf"
  term: "下极限"
  en: "limit inferior (lim inf)"
  plain: "数列「尾部的最小可能值」的极限；对集合则表示「从某一项起一直发生」。"
  topic: 1
  page: 7
- id: "series"
  term: "级数"
  en: "series"
  plain: "无穷多项相加 a₁ + a₂ + …，它的值是前 n 项和在 n → ∞ 时的极限。"
  topic: 1
  page: 8
- id: "monotone-sequence"
  term: "单调递增"
  aliases: ["单调不减"]
  en: "nondecreasing"
  plain: "后一项不小于前一项；单调有界的数列一定有极限。"
  topic: 1
  page: 13
- id: "pointwise"
  term: "逐点收敛"
  en: "pointwise convergence"
  plain: "对定义域里的每一个点 x，数列 fₙ(x) 都收敛到 f(x)。"
  topic: 1
  page: 36

# ---------- 概率空间与测度 ----------
- id: "sample-space"
  term: "样本空间"
  en: "sample space"
  plain: "一次试验所有可能的完整结局组成的集合，记作 Ω。"
  topic: 1
  page: 5
- id: "sample-point"
  term: "样本点"
  en: "sample point"
  plain: "一个完整的结局 ω；每次试验恰好实现一个样本点。"
  topic: 1
  page: 5
- id: "event"
  term: "事件"
  en: "event"
  plain: "样本空间的（允许谈概率的）子集；实现的 ω 落在里面，就说事件发生。"
  topic: 1
  page: 6
- id: "random-variable"
  term: "随机变量"
  en: "random variable"
  plain: "从样本空间到实数的（可测）函数，把结局翻译成数字；随机性来自「实现了哪个 ω」。"
  topic: 1
  page: 5
- id: "stochastic-process"
  term: "随机过程"
  en: "stochastic process"
  plain: "一族随时间变化的随机变量 {Sₜ}；固定 ω 得到一条路径。"
  topic: 1
  page: 5
- id: "sigma-algebra"
  term: "σ-代数"
  aliases: ["σ代数", "sigma-代数"]
  en: "sigma-algebra"
  plain: "允许谈概率的「事件清单」：含 Ω，对补集和可数并封闭。"
  topic: 1
  page: 9
- id: "generated-sigma-algebra"
  term: "生成的 σ-代数"
  aliases: ["生成的σ-代数"]
  en: "generated sigma-algebra"
  plain: "包含给定集合族的最小 σ-代数 σ(𝒞)：只加入「被逼着加入」的集合。"
  topic: 1
  page: 11
- id: "borel"
  term: "博雷尔 σ-代数"
  aliases: ["Borel σ-代数", "博雷尔集"]
  en: "Borel sigma-algebra"
  plain: "由实数轴上所有开区间生成的 σ-代数 𝓑(ℝ)，包含所有常见的集合。"
  topic: 1
  page: 11
- id: "measurable-space"
  term: "可测空间"
  en: "measurable space"
  plain: "一个集合加上它上面的一个 σ-代数，例如 (Ω, 𝓕)；还没有给出测度。"
  topic: 1
  page: 12
- id: "measure"
  term: "测度"
  en: "measure"
  plain: "给 σ-代数里的每个集合一个 [0, ∞] 中的「大小」，空集为 0，并且可数可加。"
  topic: 1
  page: 12
- id: "measure-space"
  term: "测度空间"
  en: "measure space"
  plain: "三元组 (S, 𝓜, μ)：空间、σ-代数、测度。"
  topic: 1
  page: 12
- id: "probability-measure"
  term: "概率测度"
  en: "probability measure"
  plain: "总质量 P(Ω) = 1 的测度。"
  topic: 1
  page: 3
- id: "probability-space"
  term: "概率空间"
  en: "probability space"
  plain: "三元组 (Ω, 𝓕, P)：样本空间、事件的 σ-代数、概率测度。"
  topic: 1
  page: 3
- id: "countable-additivity"
  term: "可数可加性"
  aliases: ["可数可加"]
  en: "countable additivity"
  plain: "两两不交的可数个集合，并集的测度等于各自测度之和。"
  topic: 1
  page: 8
- id: "subadditivity"
  term: "次可加性"
  en: "subadditivity"
  plain: "并集的测度不超过各部分测度之和：μ(A ∪ B) ≤ μ(A) + μ(B)。"
  topic: 1
  page: 18
- id: "continuity-below"
  term: "从下连续"
  en: "continuity from below"
  plain: "集合一层层变大（Eₙ ↑ E）时，测度也跟着收敛：μ(Eₙ) → μ(E)。"
  topic: 1
  page: 13
- id: "continuity-above"
  term: "从上连续"
  en: "continuity from above"
  plain: "集合一层层变小（Eₙ ↓ E）且 μ(E₁) < ∞ 时，μ(Eₙ) → μ(E)。"
  topic: 1
  page: 14
- id: "point-mass"
  term: "点质量"
  aliases: ["狄拉克测度"]
  en: "point mass (Dirac measure)"
  plain: "把全部质量 1 放在一个点上：δ₀(E) = 1 当且仅当 0 ∈ E。"
  topic: 1
  page: 10

# ---------- 长度的构造 ----------
- id: "elementary-set"
  term: "初等集"
  en: "elementary set"
  plain: "有限个有界区间的不交并；它的「长度」就是各区间长度之和。"
  topic: 1
  page: 16
- id: "jordan-content"
  term: "乔丹容量"
  aliases: ["若尔当容量", "乔丹测度", "若尔当测度"]
  en: "Jordan content"
  plain: "用有限个区间从里、从外逼近一个集合；两边逼近值相等时才有定义。"
  topic: 1
  page: 16
- id: "outer-measure"
  term: "外测度"
  en: "outer measure"
  plain: "用可数个区间覆盖集合，所有覆盖总长度的下确界 m*(E)；对每个子集都有定义。"
  topic: 1
  page: 18
- id: "caratheodory"
  term: "卡拉泰奥多里"
  aliases: ["卡拉泰奥多里可测"]
  en: "Carathéodory"
  plain: "卡拉泰奥多里判别：用 E 去切任何集合 A，两块外测度之和都等于 m*(A)。"
  topic: 1
  page: 20
- id: "vitali"
  term: "维塔利集"
  en: "Vitali set"
  plain: "用选择公理造出的「坏」集合，证明了不可能给 ℝ 的所有子集定义长度。"
  topic: 1
  page: 21
- id: "translation-invariance"
  term: "平移不变性"
  aliases: ["平移不变"]
  en: "translation invariance"
  plain: "把集合整体平移，测度不变：μ(E + t) = μ(E)。长度就有这个性质。"
  topic: 1
  page: 21
- id: "lebesgue-measure"
  term: "勒贝格测度"
  en: "Lebesgue measure"
  plain: "实数轴上「长度」的严格版本，定义在勒贝格可测集上，m([a,b]) = b − a。"
  topic: 1
  page: 23
- id: "lebesgue-measurable"
  term: "勒贝格可测"
  en: "Lebesgue measurable"
  plain: "能被勒贝格测度称重量的集合（通过卡拉泰奥多里判别）。"
  topic: 1
  page: 23
- id: "null-set"
  term: "零测集"
  en: "null set"
  plain: "测度为 0 的集合，例如单点、有理数全体、康托尔集。"
  topic: 1
  page: 23
- id: "complete-measure"
  term: "完备测度"
  aliases: ["完备的测度"]
  en: "complete measure"
  plain: "零测集的任何子集也都可测（并且测度为 0）。"
  topic: 1
  page: 23

# ---------- 积分 ----------
- id: "partition"
  term: "分割"
  en: "partition"
  plain: "把区间 [a,b] 用分点 a = x₀ < x₁ < … < xₙ = b 切成小段。"
  topic: 1
  page: 25
- id: "darboux"
  term: "达布和"
  aliases: ["达布上和", "达布下和"]
  en: "Darboux sums"
  plain: "每小段取函数的下确界（或上确界）乘以长度再求和；上下和夹住黎曼积分。"
  topic: 1
  page: 25
- id: "oscillation"
  term: "振幅"
  en: "oscillation"
  plain: "函数在一小段上的「最高值减最低值」M − m，衡量函数在那里抖动得多厉害。"
  topic: 1
  page: 25
- id: "riemann-integral"
  term: "黎曼积分"
  aliases: ["黎曼可积"]
  en: "Riemann integral"
  plain: "大一学的定积分：按 x 轴切竖条求和取极限。"
  topic: 1
  page: 25
- id: "dirichlet"
  term: "狄利克雷函数"
  en: "Dirichlet function"
  plain: "在有理点取 1、无理点取 0 的函数；黎曼不可积，勒贝格积分为 0。"
  topic: 1
  page: 28
- id: "measurable-function"
  term: "可测函数"
  en: "measurable function"
  plain: "对每个 a，集合 {f > a} 都可测；这样的函数才能积分。"
  topic: 1
  page: 29
- id: "simple-function"
  term: "简单函数"
  en: "simple function"
  plain: "只取有限个值的可测函数，是若干示性函数的线性组合，图像像台阶。"
  topic: 1
  page: 30
- id: "canonical-representation"
  term: "标准表示"
  en: "canonical representation"
  plain: "把简单函数写成 Σ aₖ 𝟏_{Aₖ}，其中 aₖ 各不相同、Aₖ = {s = aₖ}。"
  topic: 1
  page: 30
- id: "lebesgue-integral"
  term: "勒贝格积分"
  en: "Lebesgue integral"
  plain: "按函数值分块的积分：先定义简单函数的积分，再用下方的简单函数逼近取上确界。"
  topic: 1
  page: 33
- id: "positive-part"
  term: "正部"
  aliases: ["负部"]
  en: "positive / negative part"
  plain: "f⁺ = max(f, 0)，f⁻ = max(−f, 0)，f = f⁺ − f⁻，|f| = f⁺ + f⁻。"
  topic: 1
  page: 33
- id: "almost-everywhere"
  term: "几乎处处"
  en: "almost everywhere (a.e.)"
  plain: "除了一个测度为 0 的集合之外都成立；零测集上的值不影响积分。"
  topic: 1
  page: 43
- id: "integrable"
  term: "可积"
  en: "integrable (L¹)"
  plain: "∫|f| dμ < ∞。全体可积函数记作 L¹(μ)。"
  topic: 1
  page: 29
- id: "mct"
  term: "单调收敛定理"
  en: "monotone convergence theorem (MCT)"
  plain: "非负可测函数单调递增地收敛时，积分也收敛：∫fₙ ↑ ∫f。"
  topic: 1
  page: 36
- id: "fatou"
  term: "Fatou 引理"
  aliases: ["法图引理"]
  en: "Fatou's lemma"
  plain: "非负可测函数列满足 ∫ liminf fₙ ≤ liminf ∫ fₙ（只保证这个方向）。"
  topic: 1
  page: 41
- id: "dct"
  term: "控制收敛定理"
  en: "dominated convergence theorem (DCT)"
  plain: "fₙ → f 几乎处处且 |fₙ| ≤ g、g 可积时，∫fₙ → ∫f。"
  topic: 1
  page: 44
- id: "bct"
  term: "有界收敛定理"
  en: "bounded convergence theorem (BCT)"
  plain: "有限测度上一致有界、几乎处处收敛的函数列，积分收敛；是 DCT 的特例。"
  topic: 1
  page: 46

# ---------- 第 2 讲 ----------
- id: "expectation"
  term: "期望"
  aliases: ["数学期望"]
  en: "expectation"
  plain: "随机变量对概率测度的积分 E[X] = ∫ X dP，也就是「加权平均」。"
  topic: 2
  page: 5
- id: "law"
  term: "分布"
  en: "law / distribution"
  plain: "X 把概率「推」到取值空间上得到的测度：L(X)(B) = P(X ∈ B)。"
  topic: 2
  page: 6
- id: "cdf"
  term: "累积分布函数"
  aliases: ["分布函数"]
  en: "cumulative distribution function (CDF)"
  plain: "F(x) = P(X ≤ x)，单调不减、右连续，完全决定分布。"
  topic: 2
  page: 8
- id: "quantile"
  term: "分位数"
  aliases: ["广义分位数"]
  en: "quantile"
  plain: "Q(u) = inf{x : F(x) ≥ u}，是 CDF 的「广义反函数」。"
  topic: 2
  page: 14
- id: "inverse-transform"
  term: "逆变换法"
  en: "inverse transform method"
  plain: "U 服从 (0,1) 上的均匀分布时，Q(U) 的分布函数恰好是 F，用来生成任意分布。"
  topic: 2
  page: 14
- id: "density"
  term: "概率密度"
  aliases: ["密度函数"]
  en: "density"
  plain: "满足 P(X ∈ B) = ∫_B f(x) dx 的函数 f；有密度等价于 CDF 绝对连续。"
  topic: 2
  page: 17
- id: "absolute-continuity"
  term: "绝对连续"
  en: "absolute continuity"
  plain: "函数版：小区间总长很小时增量总和也很小；测度版：Q ≪ P，P 为零的事件 Q 也为零。"
  topic: 2
  page: 17
- id: "cantor-set"
  term: "康托尔集"
  en: "Cantor set"
  plain: "反复挖掉中间三分之一得到的集合：不可数，但长度为 0。"
  topic: 2
  page: 18
- id: "moment"
  term: "阶矩"
  aliases: ["p 阶矩"]
  en: "moment"
  plain: "E[|X|ᵖ] 叫 p 阶（绝对）矩；它有限与否反映尾部有多「重」。"
  topic: 2
  page: 21
- id: "convex"
  term: "凸函数"
  en: "convex function"
  plain: "图像上任意两点连线都在图像上方的函数，例如 x²、eˣ。"
  topic: 2
  page: 23
- id: "jensen"
  term: "Jensen 不等式"
  en: "Jensen's inequality"
  plain: "φ 凸时 φ(E X) ≤ E φ(X)，例如 (E X)² ≤ E X²。"
  topic: 2
  page: 24
- id: "holder"
  term: "Hölder 不等式"
  en: "Hölder's inequality"
  plain: "E|XY| ≤ ‖X‖_p ‖Y‖_q（1/p + 1/q = 1）；p = q = 2 就是柯西–施瓦茨不等式。"
  topic: 2
  page: 26
- id: "markov"
  term: "Markov 不等式"
  aliases: ["马尔可夫不等式"]
  en: "Markov's inequality"
  plain: "X ≥ 0 时 P(X ≥ t) ≤ E X / t：期望小，取大值的概率就小。"
  topic: 2
  page: 29
- id: "chebyshev"
  term: "Chebyshev 不等式"
  aliases: ["切比雪夫不等式"]
  en: "Chebyshev's inequality"
  plain: "P(|X − μ| ≥ t) ≤ σ² / t²：方差控制偏离均值的概率。"
  topic: 2
  page: 29
- id: "variance"
  term: "方差"
  en: "variance"
  plain: "Var X = E[(X − E X)²]，衡量随机变量围绕均值的波动大小。"
  topic: 2
  page: 32

# ---------- 第 3 讲 ----------
- id: "infinitely-often"
  term: "无穷多次"
  aliases: ["无穷次发生"]
  en: "infinitely often (i.o.)"
  plain: "「Aₙ 发生无穷多次」就是集合 lim sup Aₙ。"
  topic: 3
  page: 3
- id: "borel-cantelli"
  term: "Borel–Cantelli 引理"
  en: "Borel–Cantelli lemma"
  plain: "概率之和有限 ⇒ 只发生有限次；独立且概率之和无穷 ⇒ 发生无穷多次。"
  topic: 3
  page: 4
- id: "independence"
  term: "独立"
  aliases: ["相互独立"]
  en: "independence"
  plain: "任意有限个事件同时发生的概率等于各自概率的乘积。"
  topic: 3
  page: 6
- id: "almost-sure"
  term: "几乎必然收敛"
  aliases: ["几乎必然"]
  en: "almost sure convergence"
  plain: "除了概率为 0 的结局以外，Xₙ(ω) 都收敛到 X(ω)。"
  topic: 3
  page: 9
- id: "in-probability"
  term: "依概率收敛"
  en: "convergence in probability"
  plain: "对每个 ε > 0，P(|Xₙ − X| > ε) → 0；比几乎必然收敛弱。"
  topic: 3
  page: 14
- id: "subsequence"
  term: "子列"
  en: "subsequence"
  plain: "从一个数列里按顺序挑出无穷多项组成的新数列。"
  topic: 3
  page: 16
- id: "radon-nikodym"
  term: "Radon–Nikodym 导数"
  aliases: ["Radon–Nikodym 定理"]
  en: "Radon–Nikodym derivative"
  plain: "Q ≪ P 时存在 L = dQ/dP ≥ 0，使 Q(A) = ∫_A L dP；它是「换测度的密度」。"
  topic: 3
  page: 27
- id: "change-of-measure"
  term: "换测度"
  en: "change of measure"
  plain: "用 E_Q[X] = E_P[X · dQ/dP] 在两个概率之间换算期望。"
  topic: 3
  page: 32
- id: "importance-sampling"
  term: "重要性抽样"
  en: "importance sampling"
  plain: "从另一个更合适的分布抽样，再乘以权重纠正，从而减小估计的方差。"
  topic: 3
  page: 38
