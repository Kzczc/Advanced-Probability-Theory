  - { page: 5, slide: "第 5–6 页", kind: proof-exercise, title: 均值无穷时 lim sup |Sₙ|/aₙ 只能是 0 或 ∞, title_en: "Infinite mean: lim sup |Sₙ|/aₙ is 0 or ∞", source: [{ page: 5, from: 0.636, to: 0.866 }, { page: 6, from: 0.100, to: 0.742 }] }
