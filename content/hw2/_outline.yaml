# 作业 2 逐题大纲。source 标明每道题在解答 PDF 中的位置：page 是 PDF 页码，from/to 是占页高的比例。
sections:
  - id: s1
    title: 收敛方式
    title_en: Modes of convergence
    pages: [1, 3]
  - id: s2
    title: 大数定律与中心极限定理
    title_en: Laws of large numbers and the central limit theorem
    pages: [4, 9]
  - id: s3
    title: 离散鞅
    title_en: Discrete martingales
    pages: [10, 12]

pages:
